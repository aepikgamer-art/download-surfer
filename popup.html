<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; background: #101024; color: #fff; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 12px; opacity: .8; margin: 6px 0; }
    label { display: block; font-size: 13px; margin: 10px 0; }
    button {
      width: 100%; padding: 8px; border: 0; border-radius: 6px; cursor: pointer;
      background: linear-gradient(90deg, #7cf5ff, #b6ff7c); color: #101024; font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Download Surfer</h1>
  <p>An endless runner that opens automatically while your downloads run.</p>
  <label><input type="checkbox" id="autoOpen" checked /> Auto-open game when a download starts</label>
  <label><input type="checkbox" id="closeWhenDone" checked /> Close game when downloads finish</label>
  <button id="play">Play now</button>
  <script src="popup.js"></script>
</body>
</html>
